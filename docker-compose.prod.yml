# Production override (single VPS). Host Nginx terminates TLS and proxies directly to systemd
# API/Web services. deploy.sh starts only PostgreSQL and Redis with loopback-only host ports.

# Own project name: volumes robux-prod_pgdata and robux-prod_redisdata belong to production only.
name: robux-prod

x-prod: &prod
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  postgres:
    <<: *prod
    mem_limit: 1g
    # Host application services reach the DB through loopback; never publish on 0.0.0.0.
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'

  redis:
    <<: *prod
    mem_limit: 512m
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6380}:6379'

  migrate:
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  api:
    <<: *prod
    environment:
      NODE_ENV: production
    mem_limit: 512m
    cpus: 1.0

  worker:
    <<: *prod
    environment:
      NODE_ENV: production
      # No authorized provider exists yet (D-01): QUEUED orders wait, their FULFILLMENT_REQUESTED
      # events stay unpublished. Changing this needs an approved provider adapter.
      FULFILLMENT_PROVIDER: none
    mem_limit: 512m
    cpus: 1.0

  scheduler:
    <<: *prod
    environment:
      NODE_ENV: production
    mem_limit: 256m
    cpus: 0.5

  frontend:
    <<: *prod
    environment:
      NODE_ENV: production
    mem_limit: 512m
    cpus: 1.0

  nginx:
    <<: *prod
    volumes:
      - ./infra/nginx/prod:/etc/nginx/templates:ro
    # Retained only for legacy/manual Compose use. Production deploy.sh does not start this edge.
    mem_limit: 128m
