ssl_certificate     /run/secrets/origin_cert;
ssl_certificate_key /run/secrets/origin_key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1h;
ssl_session_tickets off;

# Authenticated Origin Pulls (Cloudflare mTLS). Enable in Phase 18 once the Cloudflare
# origin-pull CA certificate is provisioned as a secret:
# ssl_client_certificate /run/secrets/cloudflare_origin_pull_ca;
# ssl_verify_client on;
