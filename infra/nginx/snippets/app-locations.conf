# Frontend host routing (ADR-008). Browser API calls are same-origin: /api/ goes to the API,
# everything else to Next.js. The frontend container health route stays internal.
location = /healthz { return 404; }

location /api/ {
  limit_req zone=api_general burst=40 nodelay;
  proxy_pass http://api_upstream;
  include /etc/nginx/snippets/proxy.conf;
}

location / {
  limit_req zone=web_general burst=60 nodelay;
  proxy_pass http://frontend_upstream;
  include /etc/nginx/snippets/proxy.conf;
}
