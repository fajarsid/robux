# Shared http-level settings. Included from the dev and prod site templates.
server_tokens off;
keepalive_timeout 30s;
client_max_body_size 1m;
client_body_timeout 10s;
client_header_timeout 10s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

# Preserve the public client address supplied by the upstream host Nginx.
map $http_x_forwarded_for $forwarded_for {
  default $http_x_forwarded_for;
  ''      $remote_addr;
}

# Guest tracking tokens are credentials: never write them to access logs (D-03).
map $request_uri $loggable_uri {
  ~^/order/[^/?]+         "/order/[token]";
  ~^/api/v1/track/[^/?]+  "/api/v1/track/[token]";
  default                 $request_uri;
}

log_format json escape=json
  '{"timestamp":"$time_iso8601","service":"nginx","requestId":"$request_id",'
  '"remoteAddr":"$remote_addr","host":"$host","method":"$request_method",'
  '"uri":"$loggable_uri","status":$status,"bytes":$body_bytes_sent,'
  '"durationMs":$request_time,"upstreamStatus":"$upstream_status",'
  '"upstreamTime":"$upstream_response_time","userAgent":"$http_user_agent"}';
access_log /dev/stdout json;

# Basic edge rate limits; the API applies finer per-user/per-endpoint limits (Phase 3/16).
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=web_general:10m rate=30r/s;
limit_req_status 429;

upstream frontend_upstream {
  server frontend:3000;
  keepalive 16;
}

upstream api_upstream {
  server api:4000;
  keepalive 16;
}

# Container-local health endpoint for the Docker health check. Not published.
server {
  listen 127.0.0.1:8081;
  access_log off;
  location = /nginx-health { return 200 "ok
"; }
  location / { return 404; }
}
