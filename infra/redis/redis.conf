# Redis for BullMQ queues, locks, rate limits and cache. Not a source of truth (ADR-003, pending).
bind 0.0.0.0
port 6379
protected-mode yes
dir /data

# Persistence: queue state survives restarts; PostgreSQL + outbox can still rebuild it.
appendonly yes
appendfsync everysec

# Required by BullMQ: never evict queue keys under memory pressure.
maxmemory-policy noeviction

# Dangerous commands disabled. Full ACL hardening is part of Phase 16.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

# Password is written to this file at container start from the Compose secret.
include /tmp/redis-auth.conf
